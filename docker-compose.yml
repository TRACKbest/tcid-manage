x-jitsi-env: &jitsi-env
  TZ: Indian/Antananarivo
  PUBLIC_URL: https://${VPS_DOMAIN:?Set VPS_DOMAIN in the VPS .env file}
  XMPP_SERVER: xmpp.meet.jitsi
  XMPP_DOMAIN: meet.jitsi
  XMPP_AUTH_DOMAIN: auth.meet.jitsi
  XMPP_MUC_DOMAIN: muc.meet.jitsi
  XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
  XMPP_GUEST_DOMAIN: guest.meet.jitsi
  XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
  ENABLE_XMPP_WEBSOCKET: "1"
  ENABLE_AUTH: "1"
  ENABLE_GUESTS: "0"
  AUTH_TYPE: jwt
  JWT_APP_ID: tcid-center
  JWT_APP_SECRET: ${JITSI_JWT_SECRET:?Set JITSI_JWT_SECRET in the VPS .env file}
  JWT_ACCEPTED_ISSUERS: tcid-center
  JWT_ACCEPTED_AUDIENCES: jitsi
  JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?Set JICOFO_AUTH_PASSWORD in the VPS .env file}
  JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?Set JVB_AUTH_PASSWORD in the VPS .env file}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the VPS .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the VPS .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && exec daphne -b 0.0.0.0 -p 8000 lms_api.asgi:application"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_SITE_URL: /
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- Virtual classroom: Jitsi Meet (SFU) ----------------------------------
  # Served on https://<VPS_DOMAIN>/meet/ (Jitsi "meet" tenant) through Caddy. Only learners/trainers
  # holding a JWT signed by the backend can join a room. Media flows through
  # the videobridge on 10000/udp (open it in the VPS firewall), with coturn as
  # a fallback for networks that block UDP.
  jitsi-web:
    image: ghcr.io/jitsi/web:stable-11146-2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    environment:
      <<: *jitsi-env
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      DISABLE_DEEP_LINKING: "true"
      DEFAULT_LANGUAGE: fr
      ENABLE_PREJOIN_PAGE: "true"
      ENABLE_WELCOME_PAGE: "false"
      ENABLE_CLOSE_PAGE: "false"
      TOOLBAR_BUTTONS: microphone,camera,desktop,chat,raisehand,participants-pane,tileview,settings,fullscreen,select-background,hangup
    volumes:
      - jitsi_web_config:/config
      # Jitsi lives under /meet/: its relative assets must resolve there,
      # not at the site root (which is the React app).
      - ./jitsi/base.html:/usr/share/jitsi-meet/base.html:ro
    expose:
      - "8000"
    networks:
      - default
      - meet.jitsi
    depends_on:
      - jitsi-jvb

  jitsi-prosody:
    image: ghcr.io/jitsi/prosody:stable-11146-2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    environment:
      <<: *jitsi-env
      XMPP_MUC_MODULES: token_affiliation
      TURN_CREDENTIALS: ${TURN_SECRET:?Set TURN_SECRET in the VPS .env file}
      TURN_HOST: ${JVB_ADVERTISE_IPS:?Set JVB_ADVERTISE_IPS in the VPS .env file}
      TURN_PORT: "3478"
      TURN_TRANSPORT: udp,tcp
    volumes:
      - jitsi_prosody_config:/config
      - jitsi_prosody_plugins:/prosody-plugins-custom
      # Prosody's data dir must be a volume: the root filesystem is read-only.
      - jitsi_prosody_data:/var/lib/prosody
    expose:
      - "5222"
      - "5347"
      - "5280"
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jitsi-jicofo:
    image: ghcr.io/jitsi/jicofo:stable-11146-2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    environment:
      <<: *jitsi-env
      ENABLE_AUTO_OWNER: "0"
      # REST on the internal network only; /about/health runs a real test
      # conference on a videobridge (exposed read-only as /meet/_health).
      JICOFO_ENABLE_REST: "1"
      JICOFO_ENABLE_HEALTH_CHECKS: "1"
    volumes:
      - jitsi_jicofo_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8888/about/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - jitsi-prosody
    networks:
      - meet.jitsi

  jitsi-jvb:
    image: ghcr.io/jitsi/jvb:stable-11146-2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    environment:
      <<: *jitsi-env
      JVB_PORT: "10000"
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS:?Set JVB_ADVERTISE_IPS in the VPS .env file}
    ports:
      - "10000:10000/udp"
    volumes:
      - jitsi_jvb_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/about/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - jitsi-prosody
    networks:
      - meet.jitsi

  # TURN relay used by Jitsi when a participant's network blocks UDP 10000
  # (some mobile/company networks). Open 3478/tcp+udp and 49160-49200/udp.
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in the VPS .env file}
      - --realm=${VPS_DOMAIN:?Set VPS_DOMAIN in the VPS .env file}
      - --external-ip=$$(detect-external-ip)
      - --no-cli
      - --no-multicast-peers
      - --no-tlsv1
      - --no-tlsv1_1
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VPS_DOMAIN: ${VPS_DOMAIN:?Set VPS_DOMAIN in the VPS .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - meet.jitsi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
  jitsi_web_config:
  jitsi_prosody_config:
  jitsi_prosody_plugins:
  jitsi_prosody_data:
  jitsi_jicofo_config:
  jitsi_jvb_config:

networks:
  default:
  meet.jitsi:
