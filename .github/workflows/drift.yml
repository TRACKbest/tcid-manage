name: Cluster drift check

# GitOps without an in-cluster agent: every morning the cluster is compared
# with the manifests of main. A difference (manual kubectl edit, deleted
# object...) fails this workflow, and "Run workflow" on the CI/CD pipeline
# puts the cluster back in line with Git.
on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Madagascar time
  workflow_dispatch:

env:
  GCP_PROJECT_ID: tcidcenter
  GCP_REGION: africa-south1
  GCP_DEPLOY_SA: tcid-deployer@tcidcenter.iam.gserviceaccount.com
  GCP_WIF_PROVIDER: projects/824299175311/locations/global/workloadIdentityPools/github/providers/github-oidc

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Compare cluster with Git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: tcid-cluster
          location: ${{ env.GCP_REGION }}

      - name: Diff manifests against the cluster
        working-directory: k8s/overlays/prod
        run: |
          if [ "$(kubectl -n tcid get statefulset postgres -o jsonpath='{.spec.replicas}')" = 0 ]; then
            echo "Platform asleep (stop-tcid.sh): replica counts differ on purpose, nothing to compare."
            exit 0
          fi
          # Compare with the images actually deployed, not the "latest" placeholder.
          image=$(kubectl -n tcid get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')
          sed -i "s/newTag: latest/newTag: ${image##*:}/" kustomization.yaml
          set +e
          kubectl diff -k . > drift.txt
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            echo "The cluster matches main."
          elif [ "$status" = 1 ]; then
            cat drift.txt
            echo "::error::The cluster differs from main: run the CI/CD pipeline (Run workflow) to resynchronise."
            exit 1
          else
            exit "$status"
          fi
