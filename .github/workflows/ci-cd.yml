name: CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcid
          POSTGRES_USER: tcid
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcid -d tcid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: tcid
      POSTGRES_USER: tcid
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run integration tests
        run: python manage.py test

  frontend-test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag tcid-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg REACT_APP_API_URL=/api --build-arg REACT_APP_SITE_URL=/ --tag tcid-frontend:ci ./frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package commit
        run: git archive --format=tar.gz --output=deploy.tar.gz "$GITHUB_SHA"

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: deploy.tar.gz
          target: /var/www/tcid-manage/releases/${{ github.sha }}
          overwrite: true

      - name: Start production stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ secrets.OPENAI_MAX_TOKENS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: GITHUB_SHA,VPS_HOST,OPENAI_API_KEY,OPENAI_MODEL,OPENAI_MAX_TOKENS
          script: |
            set -eu
            DEPLOY_ROOT=/var/www/tcid-manage
            RELEASE="$DEPLOY_ROOT/releases/$GITHUB_SHA"
            mkdir -p "$RELEASE"
            tar -xzf "$RELEASE/deploy.tar.gz" -C "$RELEASE"

            touch "$DEPLOY_ROOT/.env"
            chmod 600 "$DEPLOY_ROOT/.env"

            ensure_env() {
              name="$1"
              value="$2"
              grep -q "^${name}=." "$DEPLOY_ROOT/.env" && return 0
              sed -i "/^${name}=/d" "$DEPLOY_ROOT/.env"
              printf '%s=%s\n' "$name" "$value" >> "$DEPLOY_ROOT/.env"
            }
            ensure_env DJANGO_SECRET_KEY "$(openssl rand -hex 48)"
            ensure_env DJANGO_DEBUG False
            ensure_env DJANGO_ALLOWED_HOSTS "$VPS_HOST,localhost,127.0.0.1"
            ensure_env POSTGRES_DB tcid
            ensure_env POSTGRES_USER tcid
            ensure_env POSTGRES_PASSWORD "$(openssl rand -hex 32)"
            ensure_env REACT_FRONTEND_ORIGINS "http://$VPS_HOST,https://$VPS_HOST"
            ensure_env REACT_ADMIN_URL /admin

            update_env() {
              name="$1"
              value="$2"
              [ -n "$value" ] || return 0
              sed -i "/^${name}=/d" "$DEPLOY_ROOT/.env"
              printf '%s=%s\n' "$name" "$value" >> "$DEPLOY_ROOT/.env"
            }
            update_env OPENAI_API_KEY "${OPENAI_API_KEY:-}"
            update_env OPENAI_MODEL "${OPENAI_MODEL:-}"
            update_env OPENAI_MAX_TOKENS "${OPENAI_MAX_TOKENS:-}"

            ln -sfn "$DEPLOY_ROOT/.env" "$RELEASE/.env"
            ln -sfn "$RELEASE" "$DEPLOY_ROOT/current"
            cd "$DEPLOY_ROOT/current"
            docker compose -p tcid-manage config --quiet
            docker compose -p tcid-manage up --build --detach --remove-orphans

            for service in backend frontend; do
              container_id="$(docker compose -p tcid-manage ps -q "$service")"
              [ -n "$container_id" ] || {
                echo "Container manquant pour le service $service" >&2
                exit 1
              }
              attempt=0
              while [ "$attempt" -lt 30 ]; do
                health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
                [ "$health" = healthy ] && break
                [ "$health" != unhealthy ] || {
                  docker compose -p tcid-manage logs "$service"
                  exit 1
                }
                attempt=$((attempt + 1))
                sleep 10
              done
              [ "$health" = healthy ] || {
                docker compose -p tcid-manage logs "$service"
                echo "Délai d’attente dépassé pour le healthcheck $service" >&2
                exit 1
              }
            done
            docker compose -p tcid-manage ps

      - name: Remove deployment archive
        if: always()
        run: rm -f deploy.tar.gz
