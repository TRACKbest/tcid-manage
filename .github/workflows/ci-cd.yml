name: CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcid
          POSTGRES_USER: tcid
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcid -d tcid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: tcid
      POSTGRES_USER: tcid
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run integration tests
        run: python manage.py test

  frontend-test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render and validate (kustomize + kubeconform)
        run: |
          kubectl kustomize k8s/overlays/prod > rendered.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          # GKE custom resources (ManagedCertificate, BackendConfig...) have no public schema.
          ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 rendered.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 k8s/jobs/migrate.yaml

  images:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, manifests]
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tcid-repo
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GKE_ENABLED == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build --tag tcid-backend:ci ./backend
          docker build --build-arg REACT_APP_API_URL=/api --build-arg REACT_APP_SITE_URL=/ --tag tcid-frontend:ci ./frontend

      # DevSecOps gate: no image with a fixable CRITICAL vulnerability ships.
      - name: Scan images (Trivy)
        run: |
          for image in tcid-backend:ci tcid-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0 \
              image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --no-progress "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0 \
              image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress --quiet "$image"
          done

      - name: Authenticate to Google Cloud (OIDC, no key)
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Push to Artifact Registry
        if: env.PUBLISH == 'true'
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          for name in backend frontend; do
            docker tag "tcid-$name:ci" "$REGISTRY/$name:$GITHUB_SHA"
            docker push "$REGISTRY/$name:$GITHUB_SHA"
          done

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GKE_ENABLED == 'true'
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tcid-repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: tcid-cluster
          location: ${{ vars.GCP_REGION }}

      - name: Sync secrets from Secret Manager
        run: |
          kubectl apply -f k8s/base/00-namespaces.yaml
          umask 077
          dir="$RUNNER_TEMP/secrets"
          mkdir -p "$dir/app" "$dir/meet"
          fetch() {  # fetch <secret-manager-name> <file> [optional]
            gcloud secrets versions access latest --secret="$1" > "$2" 2>/dev/null \
              || { [ "${3:-}" = optional ] && : > "$2"; } \
              || { echo "Missing secret $1 in Secret Manager" >&2; exit 1; }
          }
          fetch tcid-django-secret-key "$dir/app/DJANGO_SECRET_KEY"
          fetch tcid-postgres-password "$dir/app/POSTGRES_PASSWORD"
          fetch tcid-jitsi-jwt-secret "$dir/app/JITSI_JWT_SECRET"
          fetch tcid-google-oauth-client-secret "$dir/app/GOOGLE_OAUTH_CLIENT_SECRET" optional
          fetch tcid-openai-api-key "$dir/app/OPENAI_API_KEY" optional
          cp "$dir/app/JITSI_JWT_SECRET" "$dir/meet/JITSI_JWT_SECRET"
          fetch tcid-jicofo-password "$dir/meet/JICOFO_AUTH_PASSWORD"
          fetch tcid-jvb-password "$dir/meet/JVB_AUTH_PASSWORD"
          fetch tcid-turn-secret "$dir/meet/TURN_SECRET"
          kubectl -n tcid create secret generic tcid-secrets --from-file="$dir/app" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n tcid-meet create secret generic jitsi-secrets --from-file="$dir/meet" --dry-run=client -o yaml | kubectl apply -f -
          rm -rf "$dir"

      - name: Apply manifests (images pinned to this commit)
        working-directory: k8s/overlays/prod
        run: |
          sed -i "s/newTag: latest/newTag: $GITHUB_SHA/" kustomization.yaml
          kubectl apply -k .
          kubectl -n tcid rollout status statefulset/postgres --timeout=300s

      - name: Run database migrations
        run: |
          kubectl -n tcid delete job migrate --ignore-not-found --wait=true
          sed "s#BACKEND_IMAGE#$REGISTRY/backend:$GITHUB_SHA#" k8s/jobs/migrate.yaml | kubectl apply -f -
          if ! kubectl -n tcid wait --for=condition=complete job/migrate --timeout=300s; then
            kubectl -n tcid logs job/migrate --tail=100 || true
            exit 1
          fi

      - name: Wait for rollouts
        run: |
          for d in backend frontend redis; do kubectl -n tcid rollout status "deployment/$d" --timeout=600s; done
          for d in prosody jicofo jitsi-web jvb coturn; do kubectl -n tcid-meet rollout status "deployment/$d" --timeout=600s; done

      # End-to-end checks through nginx: API + database, Jitsi web, and
      # jicofo's test conference on the videobridge.
      - name: Smoke tests
        run: |
          check() {
            for attempt in $(seq 1 12); do
              if kubectl -n tcid exec deploy/frontend -c nginx -- wget -q -O /dev/null "http://127.0.0.1:8080$1"; then
                echo "OK  $1"; return 0
              fi
              sleep 10
            done
            echo "FAIL $1" >&2; return 1
          }
          ok=1
          check /api/readyz/ || ok=0
          check /meet/config.js || ok=0
          check /meet/_health || ok=0
          kubectl get pods -n tcid -o wide
          kubectl get pods -n tcid-meet -o wide
          if [ "$ok" != 1 ]; then
            kubectl -n tcid logs deploy/backend --tail=50 || true
            kubectl -n tcid-meet logs deploy/jicofo --tail=50 || true
            kubectl -n tcid-meet logs deploy/jvb --tail=50 || true
            exit 1
          fi
