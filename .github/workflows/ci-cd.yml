name: CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcid
          POSTGRES_USER: tcid
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcid -d tcid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: tcid
      POSTGRES_USER: tcid
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run integration tests
        run: python manage.py test

  frontend-test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag tcid-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg REACT_APP_API_URL=/api --build-arg REACT_APP_SITE_URL=/ --tag tcid-frontend:ci ./frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package commit
        run: git archive --format=tar.gz --output=deploy.tar.gz "$GITHUB_SHA"

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: deploy.tar.gz
          target: /var/www/tcid-manage/releases/${{ github.sha }}
          overwrite: true

      - name: Start production stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ secrets.OPENAI_MAX_TOKENS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: GITHUB_SHA,VPS_HOST,VPS_DOMAIN,OPENAI_API_KEY,OPENAI_MODEL,OPENAI_MAX_TOKENS,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET
          script: |
            set -eu
            DEPLOY_ROOT=/var/www/tcid-manage
            RELEASE="$DEPLOY_ROOT/releases/$GITHUB_SHA"
            [ -n "${VPS_DOMAIN:-}" ] || {
              echo "Le secret GitHub VPS_DOMAIN doit contenir le domaine de production." >&2
              exit 1
            }
            mkdir -p "$RELEASE"
            tar -xzf "$RELEASE/deploy.tar.gz" -C "$RELEASE"

            touch "$DEPLOY_ROOT/.env"
            chmod 600 "$DEPLOY_ROOT/.env"

            ensure_env() {
              name="$1"
              value="$2"
              grep -q "^${name}=." "$DEPLOY_ROOT/.env" && return 0
              sed -i "/^${name}=/d" "$DEPLOY_ROOT/.env"
              printf '%s=%s\n' "$name" "$value" >> "$DEPLOY_ROOT/.env"
            }
            ensure_env DJANGO_SECRET_KEY "$(openssl rand -hex 48)"
            ensure_env DJANGO_DEBUG False
            ensure_env POSTGRES_DB tcid
            ensure_env POSTGRES_USER tcid
            ensure_env POSTGRES_PASSWORD "$(openssl rand -hex 32)"
            ensure_env REACT_ADMIN_URL /admin
            ensure_env TURN_SECRET "$(openssl rand -hex 32)"
            ensure_env JITSI_JWT_SECRET "$(openssl rand -hex 32)"
            ensure_env JICOFO_AUTH_PASSWORD "$(openssl rand -hex 24)"
            ensure_env JVB_AUTH_PASSWORD "$(openssl rand -hex 24)"

            update_env() {
              name="$1"
              value="$2"
              [ -n "$value" ] || return 0
              sed -i "/^${name}=/d" "$DEPLOY_ROOT/.env"
              printf '%s=%s\n' "$name" "$value" >> "$DEPLOY_ROOT/.env"
            }
            update_env VPS_DOMAIN "$VPS_DOMAIN"
            update_env DJANGO_ALLOWED_HOSTS "$VPS_HOST,$VPS_DOMAIN,www.$VPS_DOMAIN,localhost,127.0.0.1"
            update_env REACT_FRONTEND_ORIGINS "http://$VPS_HOST,https://$VPS_HOST,https://$VPS_DOMAIN,https://www.$VPS_DOMAIN"
            # Media (Jitsi videobridge 10000/udp, TURN 3478) must reach the VPS
            # IP directly: Cloudflare does not proxy these ports.
            update_env JVB_ADVERTISE_IPS "$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
            update_env JITSI_DOMAIN "$VPS_DOMAIN/meet"
            update_env GOOGLE_OAUTH_CLIENT_ID "${GOOGLE_OAUTH_CLIENT_ID:-}"
            update_env GOOGLE_OAUTH_CLIENT_SECRET "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
            update_env GOOGLE_OAUTH_REDIRECT_URI "https://$VPS_DOMAIN/api/auth/callback/google"
            update_env OPENAI_API_KEY "${OPENAI_API_KEY:-}"
            update_env OPENAI_MODEL "${OPENAI_MODEL:-}"
            update_env OPENAI_MAX_TOKENS "${OPENAI_MAX_TOKENS:-}"

            ln -sfn "$DEPLOY_ROOT/.env" "$RELEASE/.env"
            ln -sfn "$RELEASE" "$DEPLOY_ROOT/current"
            cd "$DEPLOY_ROOT/current"
            docker compose -p tcid-manage config --quiet
            docker compose -p tcid-manage up --build --detach --remove-orphans
            # Caddy keeps the Caddyfile of the release it was created from:
            # recreate it whenever the routing changed.
            caddy_id="$(docker compose -p tcid-manage ps -q caddy)"
            if [ -n "$caddy_id" ] && ! docker exec "$caddy_id" cat /etc/caddy/Caddyfile | cmp -s - Caddyfile; then
              docker compose -p tcid-manage up --detach --force-recreate caddy
            fi

            for service in backend frontend caddy; do
              container_id="$(docker compose -p tcid-manage ps -q "$service")"
              [ -n "$container_id" ] || {
                echo "Container manquant pour le service $service" >&2
                exit 1
              }
              attempt=0
              while [ "$attempt" -lt 30 ]; do
                health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
                [ "$health" = healthy ] && break
                [ "$health" != unhealthy ] || {
                  docker compose -p tcid-manage logs "$service"
                  exit 1
                }
                attempt=$((attempt + 1))
                sleep 10
              done
              [ "$health" = healthy ] || {
                docker compose -p tcid-manage logs "$service"
                echo "Délai d’attente dépassé pour le healthcheck $service" >&2
                exit 1
              }
            done
            docker compose -p tcid-manage ps

            # Virtual classroom smoke test: prosody must stay up and Jitsi must
            # answer on https://<domain>/meet/ through Caddy.
            sleep 20
            prosody_state="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$(docker compose -p tcid-manage ps -q jitsi-prosody)")"
            echo "jitsi-prosody: $prosody_state"
            jitsi_ok=1
            [ "${prosody_state%% *}" = running ] || jitsi_ok=0
            for path in meet/config.js meet/external_api.js; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --resolve "$VPS_DOMAIN:443:127.0.0.1" "https://$VPS_DOMAIN/$path")"
              echo "/$path -> $code"
              [ "$code" = 200 ] || jitsi_ok=0
            done
            [ "$jitsi_ok" = 1 ] || {
              docker compose -p tcid-manage logs --tail 60 jitsi-prosody jitsi-jicofo jitsi-jvb jitsi-web
              echo "La classe virtuelle (Jitsi) ne répond pas" >&2
              exit 1
            }

      - name: Remove deployment archive
        if: always()
        run: rm -f deploy.tar.gz
