# Redis (WebSocket channel layer shared by the backend replicas) and the
# nightly PostgreSQL backup. The database itself is the CloudNativePG cluster
# of 31-database.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tcid
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          # Channel-layer messages are ephemeral: no persistence needed.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          # Idle usage: 9m / 6Mi (maxmemory 128mb caps the data).
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tcid
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Daily logical backup (02:00 Madagascar time) written straight to a Cloud
# Storage bucket; the bucket's lifecycle rule deletes dumps after 30 days.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup
  namespace: tcid
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: tcid
spec:
  schedule: "0 2 * * *"
  timeZone: Indian/Antananarivo
  # Written explicitly so a deployment re-enables a backup paused by stop-tcid.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
            db-client: "true"
          annotations:
            gke-gcsfuse/volumes: "true"
        spec:
          serviceAccountName: db-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - >-
                  set -e;
                  file="/backups/tcid-$(date +%Y%m%d-%H%M).dump";
                  pg_dump -h tcid-db-rw -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$file";
                  echo "backup written: $file ($(du -h "$file" | cut -f1))"
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef: { name: tcid-config, key: POSTGRES_DB }
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef: { name: tcid-config, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: tcid-secrets, key: POSTGRES_PASSWORD }
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: tcidcenter-backups
                  mountOptions: "implicit-dirs,uid=70,gid=70"
