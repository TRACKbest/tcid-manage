apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: tcid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tcid
  labels:
    app: frontend
spec:
  # No "replicas": the HorizontalPodAutoscaler owns the pod count.
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        gke-gcsfuse/volumes: "true"
        # Read-only mount: a small sidecar without scratch space is enough.
        gke-gcsfuse/cpu-request: 50m
        gke-gcsfuse/cpu-limit: 250m
        gke-gcsfuse/memory-request: 64Mi
        gke-gcsfuse/memory-limit: 256Mi
        gke-gcsfuse/ephemeral-storage-request: 1Gi
        gke-gcsfuse/ephemeral-storage-limit: 1Gi
    spec:
      serviceAccountName: frontend
      # Longer than the load balancer's 30 s connection draining.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          # Zones without a node do not count by default: require two, so
          # Autopilot starts a node in a second zone.
          minDomains: 2
          labelSelector:
            matchLabels:
              app: frontend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      initContainers:
        # Django admin static files, collected from the same backend image
        # that is deployed, so nginx always serves the matching version.
        - name: collectstatic
          image: tcid-backend
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          envFrom:
            - configMapRef:
                name: tcid-config
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: static
              mountPath: /app/staticfiles
      containers:
        - name: nginx
          image: tcid-frontend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
            - name: BACKEND_UPSTREAM
              value: http://backend.tcid.svc.cluster.local:8000
            - name: JITSI_WEB_UPSTREAM
              value: http://jitsi-web.tcid-meet.svc.cluster.local:8000
            - name: JICOFO_UPSTREAM
              value: http://jicofo.tcid-meet.svc.cluster.local:8888
          # Idle usage: 1m / 9Mi.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # The NEG removes the pod from the load balancer before nginx stops.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: static
              mountPath: /app/staticfiles
              readOnly: true
            - name: media
              mountPath: /app/media
              readOnly: true
      volumes:
        - name: static
          emptyDir: {}
        - name: media
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: tcidcenter-media
              mountOptions: "implicit-dirs,uid=101,gid=101"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tcid
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "frontend-backendconfig"}'
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
