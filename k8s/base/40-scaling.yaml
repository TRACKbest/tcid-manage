# Autoscaling and availability.
#
# - HPA (horizontal): backend 2-10 and frontend 2-6 pods, on CPU 70 % of the
#   requests. Scale-up is fast but capped, scale-down waits 5 minutes and
#   removes one pod at a time, so the count does not oscillate.
# - VPA (vertical) in automatic mode ("InPlaceOrRecreate": the pod is resized
#   in place when possible, recreated otherwise), within minAllowed/maxAllowed.
#   It never controls the resource the HPA scales on: on backend and frontend
#   the HPA owns CPU and the VPA owns memory only (multidimensional pattern);
#   the other workloads have no HPA and get both. Limits stay those of the
#   manifests (RequestsOnly), and maxAllowed keeps every request under them.
# - PostgreSQL and the videobridge keep minReplicas 2 (VPA default): VPA never
#   evicts their single pod; new sizes apply in place or at the next restart.
# - PDB: node upgrades always keep one backend and one frontend pod.
# Redis (in-memory channel layer) and the videobridge (a conference is pinned
# to its bridge, behind one UDP address) are deliberately not scaled out.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: tcid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: tcid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend
  namespace: tcid
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources: [memory]
        controlledValues: RequestsOnly
        minAllowed: { memory: 256Mi }
        maxAllowed: { memory: 1Gi }
      - containerName: gke-gcsfuse-sidecar
        mode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: frontend
  namespace: tcid
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: nginx
        controlledResources: [memory]
        controlledValues: RequestsOnly
        minAllowed: { memory: 48Mi }
        maxAllowed: { memory: 128Mi }
      - containerName: gke-gcsfuse-sidecar
        mode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgres
  namespace: tcid
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: postgres
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        controlledValues: RequestsOnly
        minAllowed: { cpu: 100m, memory: 128Mi }
        maxAllowed: { cpu: "1", memory: 1Gi }
---
apiVersion: autoscaling.k8s.io/v1
