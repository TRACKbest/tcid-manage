apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: tcid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tcid
  labels:
    app: backend
spec:
  # No "replicas": the HorizontalPodAutoscaler owns the pod count, so a
  # deployment never resets it (stop/start scale to 0 and back to 2).
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        db-client: "true"
      annotations:
        # Cloud Storage FUSE sidecar: uploaded videos and documents live in a
        # bucket shared by every replica instead of a node-local disk.
        gke-gcsfuse/volumes: "true"
        # Sized from real usage (the default sidecar reserves 250m / 256Mi);
        # the 5 GiB default scratch space is kept for large video uploads.
        gke-gcsfuse/cpu-request: 50m
        gke-gcsfuse/cpu-limit: 500m
        gke-gcsfuse/memory-request: 128Mi
        gke-gcsfuse/memory-limit: 512Mi
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Replicas in different zones (Autopilot bills pods, not nodes, so
      # spreading costs nothing) and, inside a zone, on different nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: tcid-backend
          command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "lms_api.asgi:application"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tcid-config
            - secretRef:
                name: tcid-secrets
          # Requests from the VPA recommendation (idle: 4m / 142Mi) with
          # headroom; the CPU limit lets a pod burst while the HPA adds pods.
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Leave the load balancer time to stop sending requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /api/healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/readyz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: tcidcenter-media
              mountOptions: "implicit-dirs,uid=10001,gid=10001,file-mode=644,dir-mode=755"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tcid
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
