apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: tcid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tcid
  labels:
    app: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        db-client: "true"
      annotations:
        # Cloud Storage FUSE sidecar: uploaded videos and documents live in a
        # bucket shared by every replica instead of a node-local disk.
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: tcid-backend
          command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "lms_api.asgi:application"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tcid-config
            - secretRef:
                name: tcid-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/readyz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: tcidcenter-media
              mountOptions: "implicit-dirs,uid=10001,gid=10001,file-mode=644,dir-mode=755"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tcid
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
